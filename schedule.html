<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Общий календарь — Иван, Марина, Оля, Аня</title>
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet'/>
<style>
body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin:0; background:#e6f4f3; color:#0a3a36;}
#login-screen {position:fixed; inset:0; background:#fff; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;}
#login-screen h2 {margin-top:0; color:#007e75;}
.role-group {margin:12px 0;}
.role-group label {display:block; margin:6px 0; cursor:pointer;}
.role-group input[type="password"] {width:260px; padding:8px; margin-top:4px; border:1px solid #aaa; border-radius:4px; box-sizing:border-box;}
button#loginBtn {margin-top:16px; padding:10px 24px; background:#00a8a0; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px;}
button#loginBtn:hover {background:#007e75;}
#app {display:none; padding:20px;}
#calendar {max-width:1100px; margin:0 auto;}
.logout {position:absolute; top:12px; right:20px; background:#e07a28; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; z-index:50;}
.logout:hover {background:#c26a1e;}
.fc {font-family: inherit;}
.fc-timegrid-slot-label-cushion {font-size: 11px !important;}
.fc-toolbar-title {font-size: 16px !important;}
.fc-toolbar-chunk {font-size: 13px !important;}
.fc-col-header-cell-cushion {font-size: 11px !important;}
</style>
</head>
<body>

<div id="login-screen">
  <h2>Вход в общий календарь</h2>
  <div class="user-group">
    <label><input type="radio" name="user" value="Иван" checked> Иван</label>
    <input type="password" id="pw-Иван" placeholder="Пароль Ивана">
  </div>
  <div class="user-group">
    <label><input type="radio" name="user" value="Марина"> Марина</label>
    <input type="password" id="pw-Марина" placeholder="Пароль Марины">
  </div>
  <div class="user-group">
    <label><input type="radio" name="user" value="Оля"> Оля</label>
    <input type="password" id="pw-Оля" placeholder="Пароль Оли">
  </div>
  <div class="user-group">
    <label><input type="radio" name="user" value="Аня"> Аня</label>
    <input type="password" id="pw-Аня" placeholder="Пароль Ань">
  </div>
  <button id="loginBtn">Войти</button>
  <p style="font-size:12px;color:#666;margin-top:10px;">Пароли по умолчанию: pass1 / pass2 / pass3 / pass4. Смените в коде страницы перед публикацией.</p>
</div>

<button id="logoutBtn" class="logout">Выйти</button>

<div id="app">
  <div id="calendar"></div>
</div>

<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<script>
(() => {
  const PASSWORDS = { Иван: '1981', Марина: '1985', Оля: '2010', Аня: '2016' };
  const loginScreen = document.getElementById('login-screen');
  const app = document.getElementById('app');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginBtn = document.getElementById('loginBtn');
  let currentUser = null;

  function key(user) { return 'cal_' + user; }

  function load(user) {
    const raw = localStorage.getItem(key(user));
    return raw ? JSON.parse(raw) : [];
  }

  function save(user, evs) {
    const arr = evs.map(e => ({
      title: e.title,
      start: e.start ? e.start.toISOString() : null,
      end: e.end ? e.end.toISOString() : null,
      allDay: e.allDay,
      owner: e.extendedProps?.owner ?? user
    }));
    localStorage.setItem(key(user), JSON.stringify(arr));
  }

  loginBtn.addEventListener('click', () => {
    const user = document.querySelector('input[name="user"]:checked').value;
    const pw = document.getElementById('pw-' + user).value;
    if (PASSWORDS[user] && pw === PASSWORDS[user]) {
      currentUser = user;
      loginScreen.style.display = 'none';
      app.style.display = 'block';
      logoutBtn.style.display = 'inline-block';
      init();
    } else {
      alert('Неверный пароль для пользователя');
    }
  });

  logoutBtn.addEventListener('click', () => {
    currentUser = null;
    app.style.display = 'none';
    logoutBtn.style.display = 'none';
    loginScreen.style.display = 'flex';
    document.querySelectorAll('input[type="password"]').forEach(i => i.value = '');
    if (window.cal) { window.cal.destroy(); window.cal = null; }
  });

  function init() {
    const calEl = document.getElementById('calendar');
    window.cal = new FullCalendar.Calendar(calEl, {
      initialView: 'timeGridWeek',
      slotMinTime: '07:00:00',
      slotMaxTime: '22:00:00',
      allDaySlot: false,
      locale: 'ru',
      localeCode: 'ru',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'timeGridWeek,timeGridDay,dayGridMonth'
      },
      editable: true,
      selectable: true,
      selectMirror: true,
      dayMaxEvents: true,
      events: (() => {
        let allEvents = [];
        if (currentUser === 'Иван' || currentUser === 'Марина') {
          ['Иван', 'Марина', 'Оля', 'Аня'].forEach(u => allEvents.push(...load(u)));
        } else {
          allEvents = load(currentUser);
        }
        return allEvents.map(e => ({
      title: e.title,
      start: e.start,
      end: e.end,
      allDay: e.allDay,
          color: e.owner ? (e.owner === 'Иван' ? '#00a8a0' : e.owner === 'Марина' ? '#c00000' : e.owner === 'Оля' ? '#2ec4b6' : '#00c6c6') : undefined,
          extendedProps: { owner: e.owner ?? currentUser }
        }));
      })(),
      dateClick: info => {
        const title = prompt('Название события');
        if (title) {
          window.cal.addEvent({ title, start: info.dateStr, allDay: info.allDay, extendedProps: { owner: currentUser } });
          save(currentUser, window.cal.getEvents());
        }
      },
      eventClick: info => {
        const t = prompt('Редактировать: ' + info.event.title, info.event.title);
        if (t === null) return;
        if (t.trim() === '') {
          if (confirm('Удалить?')) { info.event.remove(); save(currentUser, window.cal.getEvents()); }
        } else {
          info.event.setProp('title', t);
          save(currentUser, window.cal.getEvents());
        }
      },
      eventDrop: () => save(currentUser, window.cal.getEvents()),
      eventResize: () => save(currentUser, window.cal.getEvents())
    });
    window.cal.render();
  }
})();
</script>
</body>
</html>
